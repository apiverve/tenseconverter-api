openapi: 3.0.4
info:
  title: Tense Converter
  description: >-
    Tense Converter rewrites text into past or future tense. Submit any passage
    with your chosen target tense to receive the transformed wording and a flag
    indicating whether the text changed.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/tenseconverter:
    post:
      summary: Tense Converter
      description: Convert text to past or future tense
      operationId: tenseconverter
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  tense: past
                  result: I was walking down the street, and I could see a dog
                  changed: true
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
                  description: The text to convert to past or future tense
                tense:
                  type: string
                  description: The tense to convert the text to
              required:
                - text
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
sampleRequest:
  text: I am walking down the street, and I can see a dog
  tense: past
